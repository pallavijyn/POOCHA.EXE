<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poocha.exe</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    overflow: hidden;
}

/* =========================
   FAKE GOOGLE PAGE
========================= */

.top {
    display: flex;
    justify-content: flex-end;
    gap: 20px;
    padding: 18px 25px;
    font-size: 14px;
}

.google {
    position: absolute;
    top: 28%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%;
}

.google-logo {
    font-size: 64px;
    font-weight: bold;
    letter-spacing: -5px;
    margin-bottom: 25px;
}

.google-logo span:nth-child(1) { color: #4285f4; }
.google-logo span:nth-child(2) { color: #ea4335; }
.google-logo span:nth-child(3) { color: #fbbc05; }
.google-logo span:nth-child(4) { color: #4285f4; }
.google-logo span:nth-child(5) { color: #34a853; }
.google-logo span:nth-child(6) { color: #ea4335; }

.search-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

#searchBox {
    width: min(580px, 80vw);
    height: 48px;
    border: 1px solid #ccc;
    border-radius: 25px;
    padding: 0 20px;
    font-size: 17px;
    outline: none;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
}

#searchBox:focus {
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
}

.buttons {
    margin-top: 25px;
}

button {
    border: none;
    padding: 11px 18px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
    background: #f8f9fa;
}

button:hover {
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
}

/* =========================
   POOCHA CONTAINER
========================= */

#poocha {
    position: fixed;

    /* IMPORTANT:
       Cat is visible even if JS doesn't run */
    left: 70vw;
    top: 60vh;

    width: 150px;
    height: 180px;

    z-index: 99999;
    pointer-events: auto;

    transition:
        left .55s ease,
        top .55s ease,
        transform .25s ease;
}

/* =========================
   CSS CAT
========================= */

.cat-art {
    position: relative;
    width: 150px;
    height: 170px;
}

/* Shadow */

.cat-shadow {
    position: absolute;
    bottom: 0;
    left: 35px;
    width: 80px;
    height: 16px;
    background: rgba(0,0,0,.18);
    border-radius: 50%;
    filter: blur(3px);
}

/* Body */

.cat-body {
    position: absolute;
    left: 40px;
    top: 70px;

    width: 70px;
    height: 82px;

    background: #f4a261;
    border: 4px solid #222;
    border-radius: 45% 45% 35% 35%;
}

/* Belly */

.belly {
    position: absolute;
    left: 12px;
    top: 20px;

    width: 38px;
    height: 48px;

    background: #ffd6a5;
    border-radius: 50%;
}

/* Head */

.cat-head {
    position: absolute;
    left: 27px;
    top: 25px;

    width: 96px;
    height: 75px;

    background: #f4a261;
    border: 4px solid #222;

    border-radius: 48% 48% 45% 45%;

    z-index: 5;
}

/* Ears */

.ear-left,
.ear-right {
    position: absolute;
    top: -27px;

    width: 38px;
    height: 38px;

    background: #f4a261;
    border: 4px solid #222;

    transform: rotate(45deg);
    z-index: -1;
}

.ear-left {
    left: 4px;
}

.ear-right {
    right: 4px;
}

.ear-left::after,
.ear-right::after {
    content: "";
    position: absolute;

    width: 19px;
    height: 19px;

    background: #ff9f9f;
    border-radius: 50%;
}

/* Eyes */

.eye {
    position: absolute;
    top: 28px;

    width: 13px;
    height: 18px;

    background: #222;
    border-radius: 50%;
}

.eye::after {
    content: "";
    position: absolute;

    width: 4px;
    height: 5px;

    background: white;
    border-radius: 50%;

    top: 3px;
    left: 3px;
}

.eye-left {
    left: 25px;
}

.eye-right {
    right: 25px;
}

/* Nose */

.nose {
    position: absolute;

    left: 42px;
    top: 47px;

    width: 11px;
    height: 8px;

    background: #e76f8a;

    border-radius: 50%;
}

/* Mouth */

.mouth {
    position: absolute;

    left: 39px;
    top: 53px;

    width: 18px;
    height: 9px;

    border-bottom: 3px solid #222;
    border-radius: 50%;
}

/* Paws */

.paw {
    position: absolute;

    bottom: -10px;

    width: 27px;
    height: 35px;

    background: #f4a261;
    border: 4px solid #222;

    border-radius: 50%;
}

.paw-left {
    left: 5px;
}

.paw-right {
    right: 5px;
}

/* Tail */

.tail {
    position: absolute;

    left: 96px;
    top: 88px;

    width: 60px;
    height: 55px;

    border: 10px solid #f4a261;
    border-left: none;

    border-radius: 0 50% 50% 0;

    transform: rotate(-20deg);

    z-index: -1;
}

/* Walking */

.walking {
    animation: bounce .5s infinite alternate;
}

@keyframes bounce {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-7px);
    }
}

/* Angry */

.angry .cat-head {
    background: #e76f51;
}

.angry .eye {
    height: 7px;
    top: 34px;
    border-radius: 50%;
}

.angry .mouth {
    border-bottom: none;
    border-top: 4px solid #222;
    top: 56px;
}

/* =========================
   DIALOGUE
========================= */

#dialog {
    position: absolute;

    top: -45px;
    left: -35px;

    background: #222;
    color: white;

    padding: 8px 13px;

    border-radius: 12px;

    font-weight: bold;
    font-size: 13px;

    white-space: nowrap;

    opacity: 0;
    transform: translateY(5px);

    transition: .2s;

    pointer-events: none;
}

#dialog.show {
    opacity: 1;
    transform: translateY(0);
}

/* X */

#closeBtn {
    position: absolute;

    right: -10px;
    top: -15px;

    width: 27px;
    height: 27px;

    padding: 0;
    margin: 0;

    border-radius: 50%;

    background: #ff5c5c;
    color: white;

    font-weight: bold;
    font-size: 15px;

    z-index: 100000;
}

/* =========================
   MOOD PANEL
========================= */

#moodPanel {
    position: fixed;

    bottom: 20px;
    left: 20px;

    background: #222;
    color: white;

    padding: 10px 15px;

    border-radius: 12px;

    font-size: 14px;

    z-index: 5000;
}

#mood {
    font-weight: bold;
}

#counter {
    margin-top: 4px;
    opacity: .8;
}

/* =========================
   WARNING
========================= */

#warning {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    background: #222;
    color: white;

    padding: 12px 20px;

    border-radius: 20px;

    font-weight: bold;

    opacity: 0;

    z-index: 100000;

    pointer-events: none;
}

#warning.show {
    animation: warning .8s ease;
}

@keyframes warning {
    0% {
        opacity: 0;
        transform: translateX(-50%) scale(.7);
    }

    30% {
        opacity: 1;
        transform: translateX(-50%) scale(1.1);
    }

    100% {
        opacity: 0;
        transform: translateX(-50%) scale(1);
    }
}

/* Screen shake */

.shake {
    animation: screenShake .35s;
}

@keyframes screenShake {
    0% { transform: translate(0); }
    25% { transform: translate(7px,-5px); }
    50% { transform: translate(-7px,5px); }
    75% { transform: translate(5px,3px); }
    100% { transform: translate(0); }
}

/* Leaving */

.leaving {
    transform: translateX(300px) rotate(20deg);
}

/* Flash */

.sabotage-flash {
    position: fixed;

    inset: 0;

    background: rgba(255,80,80,.12);

    pointer-events: none;

    z-index: 90000;

    animation: flash .35s;
}

@keyframes flash {
    from { opacity: 1; }
    to { opacity: 0; }
}

/* Footsteps */

.step {
    position: fixed;

    width: 8px;
    height: 13px;

    background: #777;

    border-radius: 50%;

    opacity: .5;

    z-index: 1000;

    animation: stepFade 1s forwards;
}

@keyframes stepFade {
    from {
        opacity: .5;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(.5);
    }
}
</style>
</head>

<body>

<!-- =========================
     FAKE GOOGLE
========================= -->

<div class="top">
    <span>Gmail</span>
    <span>Images</span>
</div>

<div class="google">

    <div class="google-logo">
        <span>G</span>
        <span>o</span>
        <span>o</span>
        <span>g</span>
        <span>l</span>
        <span>e</span>
    </div>

    <div class="search-area">
        <input
            id="searchBox"
            type="text"
            placeholder="Search something..."
            autocomplete="off"
        >
    </div>

    <div class="buttons">
        <button id="searchBtn">Google Search</button>
        <button id="luckyBtn">I'm Feeling Lucky</button>
    </div>

</div>


<!-- =========================
     POOCHA
========================= -->

<div id="poocha">

    <button id="closeBtn">×</button>

    <div id="dialog"></div>

    <div class="cat-art walking">

        <div class="cat-head">

            <div class="ear-left"></div>
            <div class="ear-right"></div>

            <div class="eye eye-left"></div>
            <div class="eye eye-right"></div>

            <div class="nose"></div>
            <div class="mouth"></div>

        </div>

        <div class="cat-body">

            <div class="belly"></div>

            <div class="paw paw-left"></div>
            <div class="paw paw-right"></div>

        </div>

        <div class="tail"></div>

        <div class="cat-shadow"></div>

    </div>

</div>


<!-- =========================
     MOOD
========================= -->

<div id="moodPanel">
    😼 Mood: <span id="mood">Mischievous</span>
    <div id="counter">Sabotages: 0</div>
</div>

<div id="warning"></div>


<script>

/* =========================
   ELEMENTS
========================= */

const poocha = document.getElementById("poocha");
const catArt = document.querySelector(".cat-art");
const searchBox = document.getElementById("searchBox");
const searchBtn = document.getElementById("searchBtn");
const luckyBtn = document.getElementById("luckyBtn");

const dialog = document.getElementById("dialog");
const mood = document.getElementById("mood");
const counter = document.getElementById("counter");
const warning = document.getElementById("warning");
const closeBtn = document.getElementById("closeBtn");

let sabotageCount = 0;
let typingTimer;
let closed = false;
let sabotaging = false;

let catX = window.innerWidth * .70;
let catY = window.innerHeight * .60;


/* =========================
   SOUND
========================= */

let audioCtx = null;

function unlockAudio() {

    try {

        if (!audioCtx) {
            audioCtx = new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
        }

        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }

    } catch(e) {}

}

function catSound(type) {

    unlockAudio();

    if (!audioCtx) return;

    try {

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "purr") {

            osc.type = "sine";
            osc.frequency.value = 80;

            gain.gain.setValueAtTime(.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                .001,
                audioCtx.currentTime + .35
            );

        }

        if (type === "meow") {

            osc.type = "sine";

            osc.frequency.setValueAtTime(
                500,
                audioCtx.currentTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                850,
                audioCtx.currentTime + .18
            );

            gain.gain.setValueAtTime(.12, audioCtx.currentTime);

            gain.gain.exponentialRampToValueAtTime(
                .001,
                audioCtx.currentTime + .35
            );

        }

        if (type === "growl") {

            osc.type = "sawtooth";

            osc.frequency.value = 90;

            gain.gain.setValueAtTime(.12, audioCtx.currentTime);

            gain.gain.exponentialRampToValueAtTime(
                .001,
                audioCtx.currentTime + .4
            );

        }

        osc.start();
        osc.stop(audioCtx.currentTime + .45);

    } catch(e) {}

}


/* =========================
   DIALOGUE
========================= */

function say(text, duration = 1800) {

    dialog.textContent = text;

    dialog.classList.add("show");

    clearTimeout(dialog.hideTimer);

    dialog.hideTimer = setTimeout(() => {
        dialog.classList.remove("show");
    }, duration);

}


/* =========================
   WARNING
========================= */

function showWarning(text) {

    warning.textContent = text;

    warning.classList.remove("show");

    void warning.offsetWidth;

    warning.classList.add("show");

}


/* =========================
   MOVE CAT
========================= */

function moveCat(x, y) {

    const maxX = window.innerWidth - 150;
    const maxY = window.innerHeight - 180;

    catX = Math.max(10, Math.min(x, maxX));
    catY = Math.max(60, Math.min(y, maxY));

    poocha.style.left = catX + "px";
    poocha.style.top = catY + "px";

}


/* =========================
   FOOTSTEPS
========================= */

function makeStep() {

    const step = document.createElement("div");

    step.className = "step";

    step.style.left =
        (catX + 55 + Math.random() * 20) + "px";

    step.style.top =
        (catY + 145) + "px";

    document.body.appendChild(step);

    setTimeout(() => {
        step.remove();
    }, 1000);

}


/* =========================
   RANDOM WANDERING
========================= */

function wander() {

    if (closed || sabotaging) return;

    const x =
        Math.random() * (window.innerWidth - 180) + 10;

    const y =
        Math.random() * (window.innerHeight - 230) + 80;

    moveCat(x, y);

    makeStep();

}

setInterval(wander, 5000);


/* =========================
   CURSOR CHASE
========================= */

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

document.addEventListener("mousemove", function(e) {

    mouseX = e.clientX;
    mouseY = e.clientY;

});

setInterval(() => {

    if (closed || sabotaging) return;

    const dx = mouseX - (catX + 75);
    const dy = mouseY - (catY + 90);

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 230 && distance > 90) {

        const newX = catX + dx * .12;
        const newY = catY + dy * .12;

        moveCat(newX, newY);

        makeStep();

    }

}, 400);


/* =========================
   CAT CLICK
========================= */

poocha.addEventListener("click", function(e) {

    if (e.target === closeBtn) return;

    if (closed) return;

    catArt.classList.add("angry");

    mood.textContent = "ANGRY 😾";

    say("DON'T TOUCH ME.");

    catSound("growl");

    moveCat(
        Math.random() * (window.innerWidth - 180),
        Math.random() * (window.innerHeight - 250) + 80
    );

    setTimeout(() => {

        catArt.classList.remove("angry");

        mood.textContent = "Mischievous";

    }, 1200);

});


/* =========================
   TYPING DETECTION
========================= */

searchBox.addEventListener("input", function() {

    clearTimeout(typingTimer);

    if (searchBox.value.trim() === "") return;

    say("Hmm... what are you searching? 👀");

    typingTimer = setTimeout(() => {

        sabotage();

    }, 3000);

});


/* =========================
   SABOTAGE
========================= */

function sabotage() {

    if (closed || sabotaging) return;

    sabotaging = true;

    sabotageCount++;

    counter.textContent =
        "Sabotages: " + sabotageCount;

    mood.textContent = "CHAOTIC 😈";

    catArt.classList.add("angry");

    catSound("growl");

    say("hehe... 😈");

    showWarning("😈 POOCHA IS SABOTAGING YOU");

    setTimeout(() => {

        /* Run toward search bar */

        moveCat(
            window.innerWidth / 2 - 100,
            window.innerHeight * .25
        );

        say("hehe...");

    }, 700);


    setTimeout(() => {

        showWarning("⬅️ GOING BACK... 😈");

        say("BYE BYE SEARCH.");

    }, 1500);


    setTimeout(() => {

        goBack();

    }, 2500);

}


/* =========================
   FAKE BACK
========================= */

function goBack() {

    searchBox.value = "";

    document.body.classList.add("shake");

    showWarning("⬅️ POOCHA PRESSED BACK");

    catSound("meow");

    say("You're welcome. 😌");

    const flash =
        document.createElement("div");

    flash.className = "sabotage-flash";

    document.body.appendChild(flash);

    setTimeout(() => {
        flash.remove();
    }, 400);


    setTimeout(() => {

        catArt.classList.remove("angry");

        mood.textContent = "Mischievous";

        sabotaging = false;

        document.body.classList.remove("shake");

        moveCat(
            Math.random() * (window.innerWidth - 180),
            Math.random() * (window.innerHeight - 250) + 80
        );

    }, 1800);

}


/* =========================
   SEARCH BUTTON
========================= */

searchBtn.addEventListener("click", function() {

    unlockAudio();

    if (searchBox.value.trim() !== "") {

        sabotage();

    } else {

        say("Search something first 🙄");

    }

});


/* =========================
   LUCKY BUTTON
========================= */

luckyBtn.addEventListener("click", function() {

    unlockAudio();

    say("You're feeling lucky? I'm feeling evil. 😈");

    setTimeout(() => {
        sabotage();
    }, 600);

});


/* =========================
   CLOSE / X BUTTON
========================= */

closeBtn.addEventListener("click", function(e) {

    e.stopPropagation();

    if (closed) return;

    closed = true;

    say("Aw...");

    mood.textContent = "Sad 🥺";

    catSound("meow");

    setTimeout(() => {

        poocha.style.opacity = "0";
        poocha.style.pointerEvents = "none";

    }, 700);

});


/* =========================
   INITIAL CAT
========================= */

window.addEventListener("load", function() {

    closed = false;

    poocha.style.opacity = "1";
    poocha.style.pointerEvents = "auto";

    moveCat(
        window.innerWidth * .70,
        window.innerHeight * .60
    );

    setTimeout(() => {

        say("pspsps... 😼");

        catSound("purr");

    }, 700);

});


/* =========================
   RESIZE
========================= */

window.addEventListener("resize", function() {

    if (!closed) {
        moveCat(catX, catY);
    }

});

</script>

</body>
</html>
