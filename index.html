<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poocha.exe</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #202124;
    overflow: hidden;
}

/* =========================
   GOOGLE PAGE
   ========================= */

.google-page {
    width: 100vw;
    height: 100vh;
    position: relative;
}

.top {
    height: 60px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    padding-right: 25px;
    gap: 22px;

    font-size: 14px;
}

.apps {
    font-size: 22px;
}

.main {
    position: absolute;

    top: 18%;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;
}

.logo {
    font-size: 80px;
    font-weight: bold;
    letter-spacing: -6px;

    margin-bottom: 30px;
}

.blue {
    color: #4285f4;
}

.red {
    color: #ea4335;
}

.yellow {
    color: #fbbc05;
}

.green {
    color: #34a853;
}

/* =========================
   SEARCH
   ========================= */

.search-container {
    width: min(580px, 90vw);
    margin: auto;
}

.search-box {
    height: 48px;

    border: 1px solid #dfe1e5;

    border-radius: 25px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    box-shadow: 0 1px 6px rgba(32,33,36,.15);
}

.search-icon {
    font-size: 20px;
    color: #777;
    margin-right: 12px;
}

#search {
    flex: 1;

    border: none;
    outline: none;

    font-size: 17px;

    background: transparent;
}

.buttons {
    margin-top: 28px;

    display: flex;
    justify-content: center;
    gap: 12px;
}

.google-btn {
    border: 1px solid #f8f9fa;

    background: #f8f9fa;

    padding: 10px 18px;

    border-radius: 4px;

    cursor: pointer;

    font-size: 14px;
}

.google-btn:hover {
    border-color: #dadce0;
}


/* =========================
   POOCHA
   ========================= */

#poocha {

    position: fixed;

    left: 50%;
    top: 70%;

    width: 105px;
    height: 125px;

    z-index: 9999;

    cursor: pointer;

    user-select: none;

    transition:
        left .35s ease,
        top .35s ease,
        transform .25s ease;

}


/* Cat */

#cat {

    font-size: 76px;

    text-align: center;

    line-height: 1;

    filter: drop-shadow(0 5px 4px rgba(0,0,0,.18));

}


/* Little shadow */

.shadow {

    width: 65px;
    height: 13px;

    background: rgba(0,0,0,.15);

    border-radius: 50%;

    margin: 3px auto;

}


/* Dialogue bubble */

#dialog {

    position: absolute;

    bottom: 108px;

    left: 50%;

    transform: translateX(-50%);

    min-width: 130px;

    max-width: 190px;

    padding: 8px 12px;

    background: white;

    border: 2px solid #222;

    border-radius: 15px;

    font-size: 12px;

    text-align: center;

    box-shadow: 0 5px 15px rgba(0,0,0,.15);

    opacity: 0;

    pointer-events: none;

    transition: opacity .25s ease;

}

#dialog.show {
    opacity: 1;
}


/* Dialogue bubble tail */

#dialog::after {

    content: "";

    position: absolute;

    bottom: -8px;

    left: 50%;

    transform: translateX(-50%);

    width: 14px;
    height: 14px;

    background: white;

    border-right: 2px solid #222;
    border-bottom: 2px solid #222;

    transform: translateX(-50%) rotate(45deg);

}


/* =========================
   CLOSE BUTTON
   ========================= */

#closeBtn {

    position: absolute;

    top: -12px;
    right: -5px;

    width: 27px;
    height: 27px;

    border: none;

    border-radius: 50%;

    background: #222;

    color: white;

    font-size: 17px;

    cursor: pointer;

    z-index: 20;

}

#closeBtn:hover {

    background: #ff5555;

    transform: scale(1.1);

}


/* =========================
   WALKING
   ========================= */

.walk {

    animation: walk 0.45s infinite alternate;

}

@keyframes walk {

    from {
        transform: translateY(0) rotate(-3deg);
    }

    to {
        transform: translateY(-7px) rotate(3deg);
    }

}


/* =========================
   ANGRY
   ========================= */

.angry {

    animation: angry .18s infinite;

}

@keyframes angry {

    0% {
        transform: rotate(-8deg);
    }

    50% {
        transform: rotate(8deg);
    }

    100% {
        transform: rotate(-8deg);
    }

}


/* =========================
   SLEEPING
   ========================= */

.sleeping {

    animation: sleep 2s infinite ease-in-out;

}

@keyframes sleep {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(.94);
    }

    100% {
        transform: scale(1);
    }

}


/* =========================
   SABOTAGE WARNING
   ========================= */

#warning {

    position: fixed;

    top: 25px;
    left: 50%;

    transform: translateX(-50%);

    background: #222;

    color: white;

    padding: 12px 20px;

    border-radius: 20px;

    font-size: 14px;

    display: none;

    z-index: 10000;

}


/* =========================
   CAT STATUS
   ========================= */

#status {

    position: fixed;

    bottom: 15px;
    left: 15px;

    font-size: 11px;

    color: #999;

    opacity: .7;

}

</style>
</head>


<body>


<!-- =========================
     FAKE GOOGLE
     ========================= -->

<div class="google-page">


    <div class="top">

        <span>Gmail</span>

        <span>Images</span>

        <span class="apps">⋮⋮⋮</span>

    </div>


    <div class="main">

        <div class="logo">

            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>

        </div>


        <div class="search-container">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    id="search"
                    type="text"
                    autocomplete="off"
                >

            </div>


            <div class="buttons">

                <button
                    class="google-btn"
                    onclick="searchGoogle()">

                    Google Search

                </button>

                <button class="google-btn">

                    I'm Feeling Lucky

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     POOCHA
     ========================= -->

<div id="poocha">


    <button id="closeBtn">×</button>


    <div id="dialog">
        purr...
    </div>


    <div id="cat">
        🐱
    </div>


    <div class="shadow"></div>


</div>


<div id="warning">
    😈 POOCHA IS SABOTAGING YOU
</div>


<div id="status">
    Poocha.exe is watching 👀
</div>


<script>


/* =========================
   ELEMENTS
   ========================= */

const pooCha = document.getElementById("poocha");

const cat = document.getElementById("cat");

const dialog = document.getElementById("dialog");

const search = document.getElementById("search");

const closeBtn = document.getElementById("closeBtn");

const warning = document.getElementById("warning");

const status = document.getElementById("status");


/* =========================
   VARIABLES
   ========================= */

let closed = false;

let typingTimer = null;

let mouseX = window.innerWidth / 2;

let mouseY = window.innerHeight / 2;

let catX = window.innerWidth / 2;

let catY = window.innerHeight * .7;

let chasing = false;


/* =========================
   DIALOG
   ========================= */

function say(message, duration = 1800) {

    if (closed) return;

    dialog.textContent = message;

    dialog.classList.add("show");


    setTimeout(() => {

        dialog.classList.remove("show");

    }, duration);

}


/* =========================
   CURSOR TRACKING
   ========================= */

document.addEventListener("mousemove", function(event) {

    mouseX = event.clientX;

    mouseY = event.clientY;

});


/* =========================
   CAT MOVEMENT
   ========================= */

function moveCat(x, y) {

    if (closed) return;


    const margin = 70;


    x = Math.max(margin, Math.min(window.innerWidth - margin, x));

    y = Math.max(margin, Math.min(window.innerHeight - margin, y));


    catX = x;

    catY = y;


    pooCha.style.left = x + "px";

    pooCha.style.top = y + "px";

}


/* =========================
   RANDOM WALK
   ========================= */

function wander() {

    if (closed || chasing) return;


    const randomX =
        Math.random() * (window.innerWidth - 140) + 70;


    const randomY =
        Math.random() * (window.innerHeight - 220) + 100;


    cat.classList.add("walk");


    moveCat(randomX, randomY);


    const messages = [

        "purr...",

        "Where are you going? 👀",

        "hehe",

        "I'm bored.",

        "Hmm...",

        "Working again?",

        "Suspicious...",

        "meow."

    ];


    if (Math.random() < .5) {

        say(
            messages[
                Math.floor(Math.random() * messages.length)
            ],
            1500
        );

    }

}


/* Move every 3 seconds */

setInterval(wander, 3000);


/* =========================
   CHASE CURSOR
   ========================= */

setInterval(function() {

    if (closed) return;


    const dx = mouseX - catX;

    const dy = mouseY - catY;

    const distance = Math.sqrt(dx * dx + dy * dy);


    /*
       If cursor gets close,
       cat becomes interested.
    */

    if (distance < 230) {

        chasing = true;

        cat.classList.add("walk");

        status.textContent = "Poocha is chasing your cursor 👀";


        /*
           Move partway toward cursor
           instead of instantly teleporting.
        */

        const newX =
            catX + dx * .18;

        const newY =
            catY + dy * .18;


        moveCat(newX, newY);


        if (distance < 100) {

            cat.classList.remove("walk");

            cat.textContent = "😼";

            say("Got you. 😼", 1000);

        }

    } else {

        chasing = false;

        cat.classList.remove("walk");

        cat.textContent = "🐱";

        status.textContent =
            "Poocha.exe is watching 👀";

    }

}, 250);


/* =========================
   CLICK CAT
   ========================= */

pooCha.addEventListener("click", function(event) {

    if (closed) return;


    /*
       Don't trigger when X is clicked.
    */

    if (event.target === closeBtn) return;


    cat.classList.remove("walk");

    cat.classList.add("angry");

    cat.textContent = "😾";


    say("DON'T TOUCH ME.", 1400);

    status.textContent =
        "Poocha is VERY angry 😾";


    /*
       Run away.
    */

    setTimeout(function() {

        cat.classList.remove("angry");

        cat.textContent = "🐱";


        const newX =
            Math.random() * (window.innerWidth - 140) + 70;


        const newY =
            Math.random() * (window.innerHeight - 220) + 100;


        moveCat(newX, newY);


        say("HMPH.", 1000);

    }, 1000);

});


/* =========================
   TYPING DETECTION
   ========================= */

search.addEventListener("input", function() {

    if (closed) return;


    clearTimeout(typingTimer);


    cat.textContent = "👀";

    cat.classList.remove("walk");


    say("Hmm... what are you doing?", 1800);


    status.textContent =
        "Poocha is monitoring your work...";


    /*
       EXACTLY 3 SECONDS
       AFTER TYPING STOPS
    */

    typingTimer = setTimeout(function() {

        sabotage();

    }, 3000);

});


/* =========================
   SABOTAGE
   ========================= */

function sabotage() {

    if (closed) return;


    cat.classList.remove("walk");

    cat.classList.add("angry");

    cat.textContent = "😈";


    say("hehe...", 2000);


    status.textContent =
        "POOCHA SABOTAGE MODE 😈";


    warning.style.display = "block";


    warning.textContent =
        "😈 POOCHA IS SABOTAGING YOU";


    /*
       Make Poocha run toward
       the search box.
    */

    const rect =
        search.getBoundingClientRect();


    moveCat(
        rect.left + rect.width / 2,
        rect.top + 70
    );


    /*
       Then perform sabotage.
    */

    setTimeout(function() {

        if (closed) return;


        warning.textContent =
            "⬅️ GOING BACK... 😈";


        say("GO BACK. 😼", 1500);


        setTimeout(function() {

            goBack();

        }, 500);


    }, 900);

}


/* =========================
   FAKE BACK
   ========================= */

function goBack() {

    if (closed) return;


    search.value = "";


    cat.classList.remove("angry");

    cat.textContent = "😼";


    say(
        "You're welcome. 😌",
        1800
    );


    status.textContent =
        "Poocha pressed BACK 😈";


    warning.textContent =
        "⬅️ POOCHA PRESSED BACK";


    /*
       Briefly flash the page.
    */

    document.body.style.transform =
        "translateX(-8px)";


    setTimeout(function() {

        document.body.style.transform =
            "translateX(8px)";

    }, 80);


    setTimeout(function() {

        document.body.style.transform =
            "translateX(0)";

    }, 160);


    setTimeout(function() {

        warning.style.display =
            "none";

    }, 1800);

}


/* =========================
   GOOGLE SEARCH BUTTON
   ========================= */

function searchGoogle() {

    if (closed) return;


    clearTimeout(typingTimer);


    cat.classList.add("angry");

    cat.textContent = "😾";


    say("NO SEARCHING. 😾", 1500);


    warning.style.display =
        "block";


    warning.textContent =
        "😾 POOCHA SAID NO";


    setTimeout(function() {

        goBack();

    }, 1000);

}


/* =========================
   CLOSE POOCHA
   ========================= */

closeBtn.addEventListener("click", function(event) {

    event.stopPropagation();


    closed = true;


    clearTimeout(typingTimer);


    cat.classList.remove("angry");

    cat.textContent = "🥺";


    say("Aw...", 1000);


    status.textContent =
        "Poocha is leaving...";


    /*
       Make the whole cat shrink.
    */

    pooCha.style.transform =
        "scale(.3)";


    pooCha.style.opacity =
        "0";


    setTimeout(function() {

        pooCha.style.display =
            "none";

    }, 900);

});


/* =========================
   START POSITION
   ========================= */

moveCat(
    window.innerWidth * .75,
    window.innerHeight * .70
);


setTimeout(function() {

    say("Psst... 👀", 1500);

}, 1000);


</script>

</body>
</html>
