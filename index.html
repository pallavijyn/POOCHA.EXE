<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poocha.exe</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080a0f;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

header{
    height:70px;
    background:#10131a;
    border-bottom:1px solid #292e38;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#69e6ad;
}

.online{
    font-size:12px;
    color:#69e6ad;
}

.main{
    height:calc(100vh - 70px);
    display:flex;
    gap:20px;
    padding:20px;
}

#game{
    position:relative;
    flex:1;
    background:#11151c;
    border:2px solid #292f3a;
    border-radius:15px;
    overflow:hidden;
}

.table{
    position:absolute;
    left:5%;
    top:8%;
    width:90%;
    height:80%;

    background:
    radial-gradient(circle,#252c37,#141922);

    border:3px solid #343c49;
    border-radius:18px;

    box-shadow:
    inset 0 0 60px rgba(0,0,0,.5),
    0 20px 50px rgba(0,0,0,.5);
}

/* EDGE */

.edge{
    position:absolute;
    right:0;
    top:0;
    width:16%;
    height:100%;

    background:rgba(255,50,60,.12);

    border-left:3px dashed #ff5963;

    pointer-events:none;
}

.edgeText{
    position:absolute;
    right:10px;
    top:50%;

    transform:rotate(90deg);

    color:#ff6c75;
    font-size:11px;
    letter-spacing:2px;
}

/* OBJECT */

.object{
    position:absolute;

    width:65px;
    height:65px;

    cursor:grab;

    z-index:10;

    transition:
    left .2s,
    top .2s,
    transform .3s,
    opacity .5s;
}

.object:active{
    cursor:grabbing;
}

/* CUP */

.cup{
    background:linear-gradient(135deg,#eeeeee,#8d98a7);

    border:3px solid white;

    border-radius:
    8px 8px 18px 18px;
}

.cup:after{
    content:"";

    position:absolute;

    width:22px;
    height:28px;

    right:-20px;
    top:14px;

    border:5px solid #aeb7c2;

    border-left:0;

    border-radius:0 15px 15px 0;
}

/* BALL */

.ball{
    background:radial-gradient(circle at 30% 30%,#ffb4b4,#e64555);

    border-radius:50%;

    border:3px solid #ffd0d0;
}

/* PHONE */

.phone{
    background:#252b35;

    border:3px solid #9ba5b3;

    border-radius:9px;
}

.phone:after{
    content:"●";

    position:absolute;

    left:25px;
    top:20px;

    color:#69e6ad;
}

/* CAT */

#cat{

    position:absolute;

    width:130px;
    height:130px;

    left:42%;
    top:40%;

    z-index:20;

    transition:
    left 1s cubic-bezier(.2,.8,.2,1),
    top 1s cubic-bezier(.2,.8,.2,1);

    cursor:pointer;
}

/* CAT HEAD */

.head{

    position:absolute;

    width:105px;
    height:90px;

    left:12px;
    top:30px;

    background:linear-gradient(145deg,#dfe4ea,#8c96a3);

    border:3px solid white;

    border-radius:50%;

    box-shadow:0 10px 25px rgba(0,0,0,.5);
}

/* EARS */

.ear{

    position:absolute;

    width:48px;
    height:52px;

    background:#b9c1cc;

    border:3px solid white;

    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.leftEar{
    left:5px;
    top:3px;
    transform:rotate(-15deg);
}

.rightEar{
    right:5px;
    top:3px;
    transform:rotate(15deg);
}

/* EYES */

.eye{

    position:absolute;

    width:16px;
    height:20px;

    background:#69e6ad;

    border-radius:50%;

    top:32px;

    box-shadow:0 0 15px #69e6ad;

    transition:.2s;
}

.leftEye{
    left:25px;
}

.rightEye{
    right:25px;
}

/* ANGRY */

.angry .eye{

    background:#ff4d58;

    box-shadow:0 0 18px #ff4d58;

    height:7px;

    top:39px;
}

.angry .head{

    transform:rotate(-3deg);
}

/* NOSE */

.nose{

    position:absolute;

    width:13px;
    height:10px;

    background:#ff91a0;

    border-radius:50%;

    left:45px;
    top:55px;
}

/* MOUTH */

.mouth{

    position:absolute;

    left:38px;
    top:66px;

    width:30px;
    height:12px;

    border-bottom:3px solid #343943;

    border-radius:50%;
}

.angry .mouth{

    border-bottom:0;

    border-top:4px solid #343943;

    top:69px;
}

/* WHISKERS */

.whisker{

    position:absolute;

    width:35px;
    height:2px;

    background:#626b77;

    top:62px;
}

.w1{
    left:-27px;
    transform:rotate(10deg);
}

.w2{
    right:-27px;
    transform:rotate(-10deg);
}

/* PAW */

.paw{

    position:absolute;

    width:48px;
    height:48px;

    background:#c7ced7;

    border-radius:50%;

    left:90px;
    top:78px;

    opacity:0;

    z-index:30;
}

/* SWAT */

.swatting .paw{

    animation:SWAT .6s ease-out;
}

@keyframes SWAT{

    0%{
        opacity:0;
        transform:translate(0,0) rotate(0);
    }

    25%{
        opacity:1;
        transform:translate(35px,-20px) rotate(-30deg);
    }

    55%{
        opacity:1;
        transform:translate(80px,5px) rotate(30deg);
    }

    100%{
        opacity:0;
        transform:translate(110px,30px) rotate(60deg);
    }

}

/* PANEL */

.panel{

    width:270px;

    display:flex;

    flex-direction:column;

    gap:15px;
}

.card{

    background:#11151c;

    border:1px solid #292f3a;

    border-radius:13px;

    padding:18px;
}

.title{

    font-size:11px;

    color:#7f8998;

    letter-spacing:2px;

    margin-bottom:12px;
}

.status{

    font-size:22px;

    font-weight:bold;

    color:#69e6ad;
}

.danger{
    color:#ff5963;
}

.bar{

    margin-top:15px;

    height:8px;

    background:#252b34;

    border-radius:10px;

    overflow:hidden;
}

.fill{

    width:15%;

    height:100%;

    background:#69e6ad;

    transition:.3s;
}

.log{

    height:170px;

    overflow:hidden;

    font-family:monospace;

    font-size:10px;

    color:#8d97a6;

    line-height:1.8;
}

.alert{
    color:#ff6670;
}

.success{
    color:#69e6ad;
}

button{

    width:100%;

    padding:12px;

    border-radius:8px;

    border:1px solid #39414e;

    background:#1a2029;

    color:white;

    cursor:pointer;

    font-weight:bold;
}

button:hover{
    background:#252c37;
}

#message{

    position:absolute;

    top:25px;

    left:50%;

    transform:translateX(-50%);

    padding:12px 20px;

    border-radius:10px;

    background:#171c25;

    border:1px solid #ff5963;

    color:#ff7b82;

    opacity:0;

    transition:.2s;

    z-index:50;
}

#message.show{
    opacity:1;
}

</style>
</head>

<body>

<header>

<div class="logo">
🐱 POOCHA<span>.exe</span>
</div>

<div class="online">
● SYSTEM ONLINE
</div>

</header>


<div class="main">

<div id="game">

<div id="message">
⚠ OBJECT DETECTED NEAR EDGE
</div>

<div class="table" id="table">

<div class="edge">
<div class="edgeText">
DANGER ZONE
</div>
</div>


<!-- CAT -->

<div id="cat">

<div class="ear leftEar"></div>
<div class="ear rightEar"></div>

<div class="head">

<div class="eye leftEye"></div>
<div class="eye rightEye"></div>

<div class="nose"></div>

<div class="mouth"></div>

<div class="whisker w1"></div>
<div class="whisker w2"></div>

</div>

<div class="paw"></div>

</div>


<!-- OBJECTS -->

<div
class="object cup"
id="cup"
style="left:25%;top:35%;">
</div>

<div
class="object ball"
id="ball"
style="left:50%;top:25%;">
</div>

<div
class="object phone"
id="phone"
style="left:65%;top:60%;">
</div>


</div>

</div>


<div class="panel">

<div class="card">

<div class="title">
SYSTEM STATUS
</div>

<div
id="status"
class="status">
MONITORING
</div>

<div class="bar">
<div
id="fill"
class="fill">
</div>
</div>

<div style="margin-top:8px;font-size:11px;color:#7f8998">
EDGE RISK:
<span id="risk">15%</span>
</div>

</div>


<div class="card">

<div class="title">
CONTROLS
</div>

<button onclick="resetGame()">
RESET TABLE
</button>

<p style="font-size:11px;color:#8d97a6;line-height:1.6">

🥤 Drag an object into the red zone.<br><br>

🐱 Click the cat to make it hiss.

</p>

</div>


<div class="card">

<div class="title">
ACTIVITY LOG
</div>

<div id="log" class="log">

<div>
SYSTEM BOOT
</div>

<div>
SENSORS ONLINE
</div>

<div>
EDGE MONITORING ACTIVE
</div>

</div>

</div>

</div>

</div>


<script>

/* ==============================
   POOCHA.EXE
   ============================== */

const table =
document.getElementById("table");

const cat =
document.getElementById("cat");

const objects =
document.querySelectorAll(".object");

let dragging = null;

let offsetX = 0;
let offsetY = 0;

let busy = false;


/* ==============================
   LOG
   ============================== */

function addLog(text,type=""){

    const log =
    document.getElementById("log");

    const item =
    document.createElement("div");

    item.className = type;

    item.innerText =
    new Date().toLocaleTimeString()+
    " — "+
    text;

    log.appendChild(item);

    while(log.children.length > 7){
        log.removeChild(log.firstChild);
    }

    log.scrollTop =
    log.scrollHeight;
}


/* ==============================
   DRAGGING
   ============================== */

objects.forEach(obj=>{

    obj.addEventListener(
    "pointerdown",
    function(e){

        if(busy)return;

        dragging = obj;

        const rect =
        obj.getBoundingClientRect();

        offsetX =
        e.clientX - rect.left;

        offsetY =
        e.clientY - rect.top;

        obj.setPointerCapture(
        e.pointerId
        );

    });


    obj.addEventListener(
    "pointermove",
    function(e){

        if(dragging !== obj)return;

        const rect =
        table.getBoundingClientRect();

        let x =
        e.clientX -
        rect.left -
        offsetX;

        let y =
        e.clientY -
        rect.top -
        offsetY;


        x =
        Math.max(
        5,
        Math.min(
        x,
        rect.width -
        obj.offsetWidth -
        5
        ));


        y =
        Math.max(
        5,
        Math.min(
        y,
        rect.height -
        obj.offsetHeight -
        5
        ));


        obj.style.left =
        x+"px";

        obj.style.top =
        y+"px";


        /* EDGE DETECTION */

        const percentage =
        (x+obj.offsetWidth) /
        rect.width;


        if(percentage > 0.78){

            showDanger();

        }else{

            hideDanger();

        }

    });


    obj.addEventListener(
    "pointerup",
    function(){

        if(dragging !== obj)return;

        dragging = null;


        const rect =
        table.getBoundingClientRect();

        const x =
        parseFloat(obj.style.left);


        const percentage =
        (x+obj.offsetWidth) /
        rect.width;


        if(percentage > 0.78){

            setTimeout(
            ()=>{
                attack(obj);
            },
            150
            );

        }

    });

});


/* ==============================
   EDGE WARNING
   ============================== */

function showDanger(){

    document
    .getElementById("message")
    .classList.add("show");

    document
    .getElementById("status")
    .innerText =
    "OBJECT AT RISK";

    document
    .getElementById("status")
    .className =
    "status danger";

    document
    .getElementById("fill")
    .style.width =
    "92%";

    document
    .getElementById("fill")
    .style.background =
    "#ff5963";

    document
    .getElementById("risk")
    .innerText =
    "92%";

}


function hideDanger(){

    if(busy)return;

    document
    .getElementById("message")
    .classList.remove("show");

    document
    .getElementById("status")
    .innerText =
    "MONITORING";

    document
    .getElementById("status")
    .className =
    "status";

    document
    .getElementById("fill")
    .style.width =
    "15%";

    document
    .getElementById("fill")
    .style.background =
    "#69e6ad";

    document
    .getElementById("risk")
    .innerText =
    "15%";

}


/* ==============================
   CAT ATTACK
   ============================== */

function attack(obj){

    if(busy)return;

    busy = true;

    addLog(
    "EDGE THREAT CONFIRMED",
    "alert"
    );


    document
    .getElementById("status")
    .innerText =
    "CAT DEPLOYED";

    document
    .getElementById("status")
    .className =
    "status danger";


    /*
       GET OBJECT POSITION
    */

    const x =
    parseFloat(obj.style.left);

    const y =
    parseFloat(obj.style.top);


    /*
       MOVE CAT NEXT TO OBJECT
    */

    cat.style.left =
    Math.max(
    10,
    x - 115
    )+"px";

    cat.style.top =
    Math.max(
    10,
    y - 20
    )+"px";


    addLog(
    "POOCHA MOVING TO TARGET",
    "alert"
    );


    /*
       WAIT FOR CAT TO ARRIVE
    */

    setTimeout(
    ()=>{

        addLog(
        "TARGET ACQUIRED",
        "alert"
        );


        cat.classList.add(
        "swatting"
        );


        /*
           HISS
        */

        loudHiss();


        addLog(
        "PAW MECHANISM ACTIVATED",
        "alert"
        );


        /*
           SWAT OBJECT
        */

        setTimeout(
        ()=>{

            obj.style.transform =
            "translate(150px,80px) rotate(100deg)";

            obj.style.opacity =
            "0";


            addLog(
            "OBJECT SWATTED OFF TABLE",
            "success"
            );


            document
            .getElementById("status")
            .innerText =
            "THREAT REMOVED";

            document
            .getElementById("status")
            .className =
            "status";


            document
            .getElementById("fill")
            .style.width =
            "5%";

            document
            .getElementById("fill")
            .style.background =
            "#69e6ad";

            document
            .getElementById("risk")
            .innerText =
            "5%";


        },
        450
        );


        /*
           RETURN CAT
        */

        setTimeout(
        ()=>{

            cat.classList.remove(
            "swatting"
            );


            cat.style.left =
            "42%";

            cat.style.top =
            "40%";


            setTimeout(
            ()=>{

                busy = false;

                resetStatus();

            },
            1000
            );

        },
        1500
        );


    },
    1000
    );

}


/* ==============================
   HISSING SOUND
   ============================== */

function loudHiss(){

    try{

        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

        const ctx =
        new AudioContext();


        /*
           WHITE NOISE
        */

        const buffer =
        ctx.createBuffer(
        1,
        ctx.sampleRate * 0.8,
        ctx.sampleRate
        );


        const data =
        buffer.getChannelData(0);


        for(
        let i=0;
        i<data.length;
        i++
        ){

            data[i] =
            (Math.random()*2-1)
            *
            Math.pow(
            1-i/data.length,
            0.5
            );

        }


        const source =
        ctx.createBufferSource();

        source.buffer =
        buffer;


        /*
           FILTER = HISSING
        */

        const filter =
        ctx.createBiquadFilter();

        filter.type =
        "highpass";

        filter.frequency.value =
        1800;


        /*
           VOLUME
        */

        const gain =
        ctx.createGain();

        gain.gain.value =
        1.8;


        source
        .connect(filter)
        .connect(gain)
        .connect(ctx.destination);


        source.start();


        /*
           EXTRA LOW GROWL
        */

        const osc =
        ctx.createOscillator();

        const oscGain =
        ctx.createGain();

        osc.type =
        "sawtooth";

        osc.frequency.value =
        90;

        oscGain.gain.value =
        0.15;


        osc
        .connect(oscGain)
        .connect(ctx.destination);

        osc.start();

        osc.stop(
        ctx.currentTime + 0.8
        );

    }
    catch(e){

        console.log(
        "Audio unavailable"
        );

    }

}


/* ==============================
   CAT CLICK
   ============================== */

cat.addEventListener(
"click",
function(){

    if(busy)return;

    busy = true;

    cat.classList.add(
    "angry"
    );


    document
    .getElementById("status")
    .innerText =
    "HISS MODE";

    document
    .getElementById("status")
    .className =
    "status danger";


    addLog(
    "HUMAN CONTACT DETECTED",
    "alert"
    );


    loudHiss();


    setTimeout(
    ()=>{

        cat.classList.remove(
        "angry"
        );

        busy = false;

        resetStatus();

    },
    1200
    );

});


/* ==============================
   RESET
   ============================== */

function resetGame(){

    objects[0].style.left =
    "25%";

    objects[0].style.top =
    "35%";


    objects[1].style.left =
    "50%";

    objects[1].style.top =
    "25%";


    objects[2].style.left =
    "65%";

    objects[2].style.top =
    "60%";


    objects.forEach(
    o=>{
        o.style.opacity="1";
        o.style.transform="";
    });


    cat.style.left =
    "42%";

    cat.style.top =
    "40%";


    cat.classList.remove(
    "angry",
    "swatting"
    );


    busy=false;

    resetStatus();

    addLog(
    "TABLE RESET",
    "success"
    );

}


function resetStatus(){

    document
    .getElementById("message")
    .classList.remove("show");

    document
    .getElementById("status")
    .innerText =
    "MONITORING";

    document
    .getElementById("status")
    .className =
    "status";

    document
    .getElementById("fill")
    .style.width =
    "15%";

    document
    .getElementById("fill")
    .style.background =
    "#69e6ad";

    document
    .getElementById("risk")
    .innerText =
    "15%";

}


</script>

</body>
</html>
