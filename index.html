<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Poocha.exe</title>


<style>

/* =========================
   BASIC PAGE
   ========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: white;
    color: #202124;
    transition: transform .07s;
}


/* =========================
   GOOGLE PAGE
   ========================= */

.google-page {
    width: 100vw;
    height: 100vh;
    position: relative;
}

.top {
    height: 60px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 22px;
    padding-right: 25px;
    font-size: 14px;
}

.top span {
    cursor: pointer;
}

.apps {
    font-size: 21px;
}

.main {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
}


/* =========================
   GOOGLE LOGO
   ========================= */

.logo {
    font-size: 80px;
    font-weight: bold;
    letter-spacing: -6px;
    margin-bottom: 30px;
}

.blue {
    color: #4285f4;
}

.red {
    color: #ea4335;
}

.yellow {
    color: #fbbc05;
}

.green {
    color: #34a853;
}


/* =========================
   SEARCH BOX
   ========================= */

.search-container {
    width: min(580px, 90vw);
    margin: auto;
}

.search-box {
    height: 48px;
    border: 1px solid #dfe1e5;
    border-radius: 25px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    box-shadow: 0 1px 6px rgba(32,33,36,.15);
}

.search-icon {
    font-size: 20px;
    color: #777;
    margin-right: 12px;
}

#search {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 17px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
}

.google-btn {
    border: 1px solid #f8f9fa;
    background: #f8f9fa;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

.google-btn:hover {
    border-color: #dadce0;
}


/* =========================
   POOCHA CONTAINER
   ========================= */

#poocha {
    position: fixed;
    width: 125px;
    height: 145px;
    z-index: 9999;
    cursor: pointer;
    user-select: none;
    transition:
        left .35s ease,
        top .35s ease;
}


/* =========================
   CAT BODY
   ========================= */

.cat-body {
    position: relative;
    width: 100px;
    height: 100px;
    margin: auto;
}


/* =========================
   CAT HEAD
   ========================= */

.cat-head {
    position: absolute;
    width: 76px;
    height: 68px;
    left: 12px;
    top: 15px;
    background: #f4a261;
    border: 3px solid #222;
    border-radius: 48% 48% 45% 45%;
    z-index: 3;
}


/* =========================
   EARS
   ========================= */

.ear-left,
.ear-right {
    position: absolute;
    width: 32px;
    height: 32px;
    background: #f4a261;
    border: 3px solid #222;
    top: -15px;
    z-index: -1;
}

.ear-left {
    left: 1px;
    transform: rotate(-30deg);
    border-radius: 5px 25px 5px 5px;
}

.ear-right {
    right: 1px;
    transform: rotate(30deg);
    border-radius: 25px 5px 5px 5px;
}

.ear-left::after,
.ear-right::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    background: #f7b6a5;
    top: 7px;
    left: 7px;
    border-radius: 50%;
}


/* =========================
   EYES
   ========================= */

.eye {
    position: absolute;
    width: 13px;
    height: 17px;
    background: #222;
    border-radius: 50%;
    top: 25px;
}

.eye-left {
    left: 17px;
}

.eye-right {
    right: 17px;
}

.eye::after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    top: 3px;
    left: 3px;
}


/* =========================
   NOSE
   ========================= */

.nose {
    position: absolute;
    left: 50%;
    top: 43px;
    transform: translateX(-50%);
    width: 9px;
    height: 7px;
    background: #e76f51;
    border-radius: 50%;
}


/* =========================
   MOUTH
   ========================= */

.mouth {
    position: absolute;
    left: 50%;
    top: 49px;
    transform: translateX(-50%);
    width: 18px;
    height: 9px;
    border-bottom: 2px solid #222;
    border-radius: 50%;
}


/* =========================
   CAT BODY
   ========================= */

.body {
    position: absolute;
    width: 67px;
    height: 58px;
    left: 17px;
    top: 68px;
    background: #f4a261;
    border: 3px solid #222;
    border-radius: 50% 50% 35% 35%;
    z-index: 2;
}


/* =========================
   BELLY
   ========================= */

.belly {
    position: absolute;
    width: 39px;
    height: 32px;
    background: #ffd6a5;
    border-radius: 50%;
    left: 11px;
    top: 14px;
}


/* =========================
   PAWS
   ========================= */

.paw {
    position: absolute;
    width: 23px;
    height: 17px;
    background: #f4a261;
    border: 3px solid #222;
    border-radius: 50%;
    bottom: -7px;
}

.paw-left {
    left: 3px;
}

.paw-right {
    right: 3px;
}


/* =========================
   TAIL
   ========================= */

.tail {
    position: absolute;
    width: 50px;
    height: 45px;
    border: 9px solid #f4a261;
    border-left: none;
    border-bottom: none;
    border-radius: 0 45px 0 0;
    right: -22px;
    bottom: 8px;
    transform: rotate(20deg);
    z-index: 1;
}


/* =========================
   CAT SHADOW
   ========================= */

.cat-shadow {
    width: 72px;
    height: 12px;
    background: rgba(0,0,0,.15);
    border-radius: 50%;
    margin: 1px auto;
}


/* =========================
   WALKING
   ========================= */

.walking .cat-body {
    animation: bounce .35s infinite alternate;
}

@keyframes bounce {

    from {
        transform:
            translateY(0)
            rotate(-3deg);
    }

    to {
        transform:
            translateY(-7px)
            rotate(3deg);
    }

}


/* =========================
   ANGRY
   ========================= */

.angry .cat-body {
    animation: shake .15s infinite;
}

@keyframes shake {

    0% {
        transform: rotate(-7deg);
    }

    50% {
        transform: rotate(7deg);
    }

    100% {
        transform: rotate(-7deg);
    }

}


/* =========================
   ANGRY FACE
   ========================= */

.angry .eye {
    height: 7px;
    top: 30px;
    border-radius: 50% 50% 0 0;
}

.angry .mouth {
    border-bottom: none;
    border-top: 3px solid #222;
    top: 50px;
}


/* =========================
   SPEECH BUBBLE
   ========================= */

#dialog {
    position: absolute;
    bottom: 135px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 135px;
    max-width: 200px;
    padding: 8px 12px;
    background: white;
    border: 2px solid #222;
    border-radius: 15px;
    font-size: 12px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,.15);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
}

#dialog.show {
    opacity: 1;
}

#dialog::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    width: 14px;
    height: 14px;
    background: white;
    border-right: 2px solid #222;
    border-bottom: 2px solid #222;
    transform:
        translateX(-50%)
        rotate(45deg);
}


/* =========================
   CLOSE BUTTON
   ========================= */

#closeBtn {
    position: absolute;
    top: -8px;
    right: -3px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #222;
    color: white;
    font-size: 18px;
    line-height: 28px;
    padding: 0;
    cursor: pointer;
    z-index: 100;
}

#closeBtn:hover {
    background: #e63946;
    transform: scale(1.1);
}


/* =========================
   MOOD PANEL
   ========================= */

#moodPanel {
    position: fixed;
    left: 15px;
    bottom: 15px;
    padding: 9px 13px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

#mood {
    font-weight: bold;
}


/* =========================
   SABOTAGE COUNTER
   ========================= */

#counter {
    position: fixed;
    right: 15px;
    top: 15px;
    padding: 8px 13px;
    background: #222;
    color: white;
    border-radius: 15px;
    font-size: 12px;
}


/* =========================
   WARNING
   ========================= */

#warning {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: white;
    padding: 12px 22px;
    border-radius: 20px;
    font-size: 14px;
    display: none;
    z-index: 10000;
}


/* =========================
   FOOTSTEPS
   ========================= */

.step {
    position: fixed;
    width: 6px;
    height: 6px;
    background: #999;
    border-radius: 50%;
    opacity: .45;
    pointer-events: none;
    z-index: 9998;
    animation: fadeStep 1s forwards;
}

@keyframes fadeStep {

    from {
        opacity: .5;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(.2);
    }

}


/* =========================
   FADE AWAY
   ========================= */

.leaving {
    transform: scale(.2);
    opacity: 0;
    transition:
        transform .7s,
        opacity .7s;
}


/* =========================
   SABOTAGE FLASH
   ========================= */

.sabotage-flash {
    animation: flash .25s 3;
}

@keyframes flash {

    0% {
        filter: none;
    }

    50% {
        filter: brightness(.8);
    }

    100% {
        filter: none;
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .logo {
        font-size: 58px;
    }

    .top {
        gap: 12px;
        padding-right: 15px;
    }

    #counter {
        top: 70px;
        right: 10px;
    }

    #moodPanel {
        left: 10px;
        bottom: 10px;
    }

}

</style>

</head>


<body>


<!-- =========================
     FAKE GOOGLE PAGE
     ========================= -->

<div class="google-page">

    <div class="top">

        <span>Gmail</span>

        <span>Images</span>

        <span class="apps">⋮⋮⋮</span>

    </div>


    <div class="main">

        <div class="logo">

            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>

        </div>


        <div class="search-container">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    id="search"
                    type="text"
                    autocomplete="off"
                    placeholder=""
                >

            </div>


            <div class="buttons">

                <button
                    class="google-btn"
                    id="searchButton">

                    Google Search

                </button>


                <button
                    class="google-btn"
                    id="luckyButton">

                    I'm Feeling Lucky

                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     POOCHA
     ========================= -->

<div id="poocha">

    <button id="closeBtn" aria-label="Close Poocha">×</button>


    <div id="dialog">
        purr...
    </div>


    <!-- CSS-DRAWN CAT -->

    <div class="cat-body">

        <div class="cat-head">

            <div class="ear-left"></div>

            <div class="ear-right"></div>

            <div class="eye eye-left"></div>

            <div class="eye eye-right"></div>

            <div class="nose"></div>

            <div class="mouth"></div>

        </div>


        <div class="body">

            <div class="belly"></div>

            <div class="paw paw-left"></div>

            <div class="paw paw-right"></div>

        </div>


        <div class="tail"></div>

    </div>


    <div class="cat-shadow"></div>

</div>


<!-- =========================
     STATUS
     ========================= -->

<div id="moodPanel">

    Mood:
    <span id="mood">😼 Mischievous</span>

</div>


<div id="counter">

    Sabotages: <span id="count">0</span>

</div>


<div id="warning">

    😈 POOCHA IS SABOTAGING YOU

</div>


<script>

/* =========================
   ELEMENTS
   ========================= */

const pooCha =
    document.getElementById("poocha");

const cat =
    document.querySelector(".cat-body");

const dialog =
    document.getElementById("dialog");

const search =
    document.getElementById("search");

const closeBtn =
    document.getElementById("closeBtn");

const warning =
    document.getElementById("warning");

const mood =
    document.getElementById("mood");

const count =
    document.getElementById("count");

const searchButton =
    document.getElementById("searchButton");

const luckyButton =
    document.getElementById("luckyButton");


/* =========================
   VARIABLES
   ========================= */

let closed = false;

let sabotageCount = 0;

let mouseX =
    window.innerWidth / 2;

let mouseY =
    window.innerHeight / 2;

let catX =
    window.innerWidth * .72;

let catY =
    window.innerHeight * .70;

let chasing = false;

let sabotaging = false;

let audioReady = false;

let audioContext = null;


/* =========================
   CAT SOUND SYSTEM
   ========================= */

/*
   Uses Web Audio instead of external files.

   This creates simple:
   - purring
   - meowing
   - angry growling

   No audio file is required.
*/

function unlockAudio() {

    if (audioReady) return;

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        if (
            audioContext.state === "suspended"
        ) {

            audioContext.resume();

        }

        audioReady = true;

    } catch (error) {

        audioReady = false;

    }

}


function catSound(type) {

    if (closed) return;

    unlockAudio();

    if (!audioContext) return;


    try {

        const now =
            audioContext.currentTime;

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        if (type === "purr") {

            oscillator.type = "sawtooth";

            oscillator.frequency.setValueAtTime(
                55,
                now
            );

            gain.gain.setValueAtTime(
                0.001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.035,
                now + .05
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + .55
            );

            oscillator.start(now);

            oscillator.stop(
                now + .6
            );

        }


        else if (type === "meow") {

            oscillator.type = "triangle";

            oscillator.frequency.setValueAtTime(
                420,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                650,
                now + .15
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                260,
                now + .45
            );

            gain.gain.setValueAtTime(
                0.001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.08,
                now + .04
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + .48
            );

            oscillator.start(now);

            oscillator.stop(
                now + .5
            );

        }


        else if (type === "growl") {

            oscillator.type = "sawtooth";

            oscillator.frequency.setValueAtTime(
                110,
                now
            );

            oscillator.frequency.exponentialRampToValueAtTime(
                70,
                now + .5
            );

            gain.gain.setValueAtTime(
                0.001,
                now
            );

            gain.gain.exponentialRampToValueAtTime(
                0.08,
                now + .05
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + .55
            );

            oscillator.start(now);

            oscillator.stop(
                now + .6
            );

        }

    } catch (error) {

        // Sound is optional; visual demo continues normally.

    }

}


/* =========================
   DIALOG
   ========================= */

function say(
    text,
    duration = 1800
) {

    if (closed) return;

    dialog.textContent = text;

    dialog.classList.add("show");


    setTimeout(
        function() {

            dialog.classList.remove(
                "show"
            );

        },
        duration
    );

}


/* =========================
   MOUSE TRACKING
   ========================= */

document.addEventListener(
    "mousemove",
    function(event) {

        mouseX =
            event.clientX;

        mouseY =
            event.clientY;

    }
);


/* =========================
   MOVE CAT
   ========================= */

function moveCat(x, y) {

    if (closed) return;


    const margin = 80;


    x = Math.max(
        margin,
        Math.min(
            window.innerWidth - margin,
            x
        )
    );


    y = Math.max(
        110,
        Math.min(
            window.innerHeight - 150,
            y
        )
    );


    catX = x;

    catY = y;


    pooCha.style.left =
        (x - 62) + "px";

    pooCha.style.top =
        (y - 70) + "px";

}


/* =========================
   FOOTSTEPS
   ========================= */

function makeStep() {

    if (closed) return;


    const step =
        document.createElement("div");

    step.className =
        "step";


    step.style.left =
        (
            catX +
            Math.random() * 35 -
            18
        ) + "px";


    step.style.top =
        (
            catY +
            55 +
            Math.random() * 12
        ) + "px";


    document.body.appendChild(
        step
    );


    setTimeout(
        function() {

            step.remove();

        },
        1000
    );

}


/* =========================
   WANDER
   ========================= */

function wander() {

    if (
        closed ||
        chasing ||
        sabotaging
    ) return;


    const x =
        Math.random() *
        (window.innerWidth - 160)
        + 80;


    const y =
        Math.random() *
        (window.innerHeight - 260)
        + 150;


    pooCha.classList.add(
        "walking"
    );


    moveCat(x, y);

    makeStep();


    const lines = [

        "purr...",

        "I'm watching you 👀",

        "Working? cringe.",

        "You look productive.",

        "Suspicious...",

        "hehe",

        "Stop working.",

        "I could ruin this.",

        "Your productivity is suspicious.",

        "No thoughts. Only sabotage.",

        "Meow.",

        "I saw that.",

        "You really thought I'd let you work?",

        "Productivity detected. Disgusting."

    ];


    if (
        Math.random() < .65
    ) {
