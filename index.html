<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google - Poocha.exe Demo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: white;
    color: #202124;
}

/* =========================
   GOOGLE PAGE
   ========================= */

.google-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Top navigation */

.top {
    height: 60px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 0 25px;
    gap: 20px;
    font-size: 14px;
}

.top span {
    cursor: pointer;
}

.apps {
    font-size: 22px;
}

/* Main Google area */

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding-top: 150px;
}

.logo {
    font-size: 82px;
    font-weight: bold;
    letter-spacing: -6px;
    margin-bottom: 30px;
}

.logo .blue {
    color: #4285f4;
}

.logo .red {
    color: #ea4335;
}

.logo .yellow {
    color: #fbbc05;
}

.logo .green {
    color: #34a853;
}

/* Search */

.search-container {
    width: min(580px, 85vw);
}

.search-box {
    height: 48px;

    border: 1px solid #dfe1e5;

    border-radius: 24px;

    display: flex;
    align-items: center;

    padding: 0 18px;

    box-shadow: 0 1px 6px rgba(32,33,36,.15);
}

.search-icon {
    font-size: 19px;
    color: #777;
    margin-right: 12px;
}

#search {
    flex: 1;

    border: none;
    outline: none;

    font-size: 17px;

    color: #202124;

    background: transparent;
}

.buttons {
    display: flex;
    justify-content: center;

    gap: 12px;

    margin-top: 30px;
}

.google-btn {
    border: 1px solid #f8f9fa;

    background: #f8f9fa;

    padding: 10px 18px;

    border-radius: 4px;

    font-size: 14px;

    cursor: pointer;
}

.google-btn:hover {
    border-color: #dadce0;
}

/* =========================
   POOCHA
   ========================= */

#poocha {

    position: fixed;

    right: 25px;
    bottom: 25px;

    width: 200px;

    background: white;

    border: 2px solid #222;

    border-radius: 22px;

    padding: 14px;

    text-align: center;

    box-shadow: 0 8px 30px rgba(0,0,0,.2);

    z-index: 9999;

    animation: appear .5s ease;

}

@keyframes appear {

    from {
        transform: scale(.5);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}

/* Close */

#closeBtn {

    position: absolute;

    top: 7px;
    right: 8px;

    width: 25px;
    height: 25px;

    border: none;

    border-radius: 50%;

    background: #eee;

    font-size: 17px;

    cursor: pointer;

}

#closeBtn:hover {

    background: #ff5c5c;

    color: white;

}

/* Cat */

#cat {

    font-size: 75px;

    line-height: 1;

    margin-top: 5px;

    cursor: pointer;

    user-select: none;

    transition: .2s;

}

#cat:hover {

    transform: scale(1.08);

}

/* Dialogue */

#dialog {

    margin-top: 8px;

    padding: 9px;

    border-radius: 12px;

    background: #f1f1f1;

    font-size: 13px;

    min-height: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

}

/* Status */

#status {

    margin-top: 7px;

    font-size: 10px;

    color: #888;

}

/* Angry */

.angry {

    animation: shake .3s infinite;

}

@keyframes shake {

    0% { transform: rotate(0); }

    25% { transform: rotate(-8deg); }

    50% { transform: rotate(8deg); }

    75% { transform: rotate(-8deg); }

    100% { transform: rotate(0); }

}

/* Sabotage flash */

#warning {

    position: fixed;

    top: 25px;

    left: 50%;

    transform: translateX(-50%);

    background: #222;

    color: white;

    padding: 12px 22px;

    border-radius: 20px;

    font-size: 14px;

    display: none;

    z-index: 10000;

}

</style>

</head>

<body>


<!-- =========================
     FAKE GOOGLE
     ========================= -->

<div class="google-page">

    <div class="top">

        <span>Gmail</span>
        <span>Images</span>
        <span class="apps">⋮⋮⋮</span>

    </div>


    <div class="main">

        <div class="logo">

            <span class="blue">G</span>
            <span class="red">o</span>
            <span class="yellow">o</span>
            <span class="blue">g</span>
            <span class="green">l</span>
            <span class="red">e</span>

        </div>


        <div class="search-container">

            <div class="search-box">

                <span class="search-icon">⌕</span>

                <input
                    id="search"
                    type="text"
                    autocomplete="off"
                    placeholder=""
                >

            </div>


            <div class="buttons">

                <button
                    class="google-btn"
                    onclick="searchGoogle()">
                    Google Search
                </button>

                <button
                    class="google-btn">
                    I'm Feeling Lucky
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     POOCHA
     ========================= -->

<div id="poocha">

    <button id="closeBtn">×</button>

    <div id="cat">🐱</div>

    <div id="dialog">
        purr... purr...
    </div>

    <div id="status">
        Poocha.exe is watching 👀
    </div>

</div>


<div id="warning">
    😈 POOCHA IS SABOTAGING YOU
</div>


<script>

/* =========================
   VARIABLES
   ========================= */

const search = document.getElementById("search");

const cat = document.getElementById("cat");

const dialog = document.getElementById("dialog");

const status = document.getElementById("status");

const pooCha = document.getElementById("poocha");

const closeBtn = document.getElementById("closeBtn");

const warning = document.getElementById("warning");


let typingTimer;

let sabotageTimer;

let closed = false;


/* =========================
   CAT DIALOG
   ========================= */

function say(text) {

    dialog.textContent = text;

}


/* =========================
   USER STARTS TYPING
   ========================= */

search.addEventListener("input", function() {

    if (closed) return;


    clearTimeout(typingTimer);

    clearTimeout(sabotageTimer);


    cat.textContent = "👀";

    say("Hmm... what are you doing?");

    status.textContent = "Poocha.exe is observing...";


    /*
       Wait exactly 3 seconds
       after the user stops typing.
    */

    typingTimer = setTimeout(function() {

        sabotageTimer = setTimeout(function() {

            sabotage();

        }, 0);

    }, 3000);

});


/* =========================
   SABOTAGE
   ========================= */

function sabotage() {

    if (closed) return;


    cat.textContent = "😈";

    cat.classList.add("angry");

    say("hehe...");

    status.textContent = "SABOTAGE MODE 😈";


    warning.style.display = "block";


    /*
       Wait half a second so
       the user sees the reaction.
    */

    setTimeout(function() {

        warning.textContent = "⬅️ GOING BACK... 😈";

    }, 400);


    /*
       FAKE BROWSER BACK

       We change the page state
       instead of actually leaving
       the demo.
    */

    setTimeout(function() {

        goBack();

    }, 900);

}


/* =========================
   FAKE BACK BUTTON
   ========================= */

function goBack() {

    /*
       Clear search.
    */

    search.value = "";


    /*
       Change cat.
    */

    cat.classList.remove("angry");

    cat.textContent = "😼";

    say("You thought you could work?");

    status.textContent = "Poocha went BACK 😈";


    warning.textContent = "⬅️ POOCHA PRESSED BACK";

    warning.style.display = "block";


    /*
       Hide warning.
    */

    setTimeout(function() {

        warning.style.display = "none";

    }, 1800);

}


/* =========================
   GOOGLE SEARCH BUTTON
   ========================= */

function searchGoogle() {

    if (closed) return;

    say("NO SEARCHING. 😾");

    cat.textContent = "😾";

    cat.classList.add("angry");

    setTimeout(function() {

        goBack();

    }, 800);

}


/* =========================
   CLICK CAT
   ========================= */

cat.addEventListener("click", function() {

    if (closed) return;


    cat.textContent = "😾";

    cat.classList.add("angry");

    say("DON'T TOUCH ME.");

    status.textContent = "Poocha is ANGRY 😾";


    setTimeout(function() {

        cat.classList.remove("angry");

        cat.textContent = "🐱";

        say("purr...");

        status.textContent = "Poocha.exe is watching 👀";

    }, 1500);

});


/* =========================
   CLOSE POOCHA
   ========================= */

closeBtn.addEventListener("click", function() {

    closed = true;


    clearTimeout(typingTimer);

    clearTimeout(sabotageTimer);


    cat.textContent = "🥺";

    say("Aw...");

    status.textContent = "You ruined my fun.";


    setTimeout(function() {

        pooCha.style.transform = "scale(.5)";

        pooCha.style.opacity = "0";


        setTimeout(function() {

            pooCha.style.display = "none";

        }, 400);

    }, 900);

});


/* =========================
   RANDOM IDLE DIALOG
   ========================= */

const messages = [

    "purr...",

    "I'm watching you 👀",

    "Are you actually working?",

    "Hmm... suspicious.",

    "hehe",

    "I could ruin this.",

    "Your productivity disgusts me.",

    "Meow.",

    "Boring..."

];


setInterval(function() {

    if (closed) return;


    /*
       Don't change the dialogue
       while the user is actively typing.
    */

    if (document.activeElement === search) {

        return;

    }


    const randomMessage =
        messages[
            Math.floor(Math.random() * messages.length)
        ];


    say(randomMessage);

}, 5000);


/* =========================
   INITIAL MESSAGE
   ========================= */

setTimeout(function() {

    say("I know what you're doing. 👀");

}, 2500);


</script>

</body>
</html>
