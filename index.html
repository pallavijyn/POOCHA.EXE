<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poocha 🐾 a cozy table guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#dcedf5;
  --sky-bottom:#f8edd8;
  --paper:#fffaf0;
  --ink:#4a3728;
  --ink-soft:#7a6656;
  --coral:#ef9d6f;
  --coral-deep:#e2795a;
  --green:#93c49a;
  --green-deep:#6fa679;
  --teal:#7fb3ae;
  --wood:#c98a53;
  --wood-deep:#a9683a;
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  font-family:'Quicksand',sans-serif;
  color:var(--ink);
  background:linear-gradient(var(--sky-top),var(--sky-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
h1{
  font-family:'Baloo 2',sans-serif;
  font-size:28px;
  margin:0 0 4px;
}
.sub{
  color:var(--ink-soft);
  font-size:14px;
  margin:0 0 18px;
  text-align:center;
}
.stage{
  position:relative;
  width:min(640px,92vw);
  height:420px;
  background:var(--paper);
  border-radius:20px;
  box-shadow:0 12px 0 rgba(74,55,40,.08),0 20px 40px rgba(74,55,40,.15);
  overflow:hidden;
}
.wall{position:absolute;inset:0 0 45% 0;background:linear-gradient(#f3e6d0,#efd9b8);}
.floor{position:absolute;left:0;right:0;bottom:0;height:20%;background:#d8c19a;}
.table{
  position:absolute;
  left:6%;
  right:6%;
  bottom:20%;
  height:35%;
  background:linear-gradient(var(--wood),var(--wood-deep));
  border-radius:10px 10px 4px 4px;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);
}
.table:before,.table:after{
  content:"";
  position:absolute;
  bottom:-38px;
  width:14px;
  height:38px;
  background:var(--wood-deep);
  border-radius:0 0 4px 4px;
}
.table:before{left:14px;}
.table:after{right:14px;}
.tabletop-edge{
  position:absolute;
  left:0;right:0;top:0;height:10px;
  background:rgba(255,255,255,.18);
  border-radius:10px 10px 0 0;
}
.cat-wrap{
  position:absolute;
  bottom:20%;
  left:50%;
  transform:translateX(-50%);
  width:170px;
  height:150px;
  cursor:pointer;
  user-select:none;
  transition:transform .18s ease;
}
.cat-wrap.dash{ transition:left .5s cubic-bezier(.3,.8,.3,1); }
.cat{position:relative;width:100%;height:100%;transform-origin:bottom center;}
.cat.purring{animation:purrbob .5s ease-in-out infinite;}
.cat.angry{animation:shake .25s ease-in-out infinite;}
.cat.dashing{animation:none;}
.cat.swipe{animation:swipe .35s ease-out;}
@keyframes swipe{0%{transform:rotate(0);}40%{transform:rotate(-8deg) translateX(10px);}100%{transform:rotate(0);}}
@keyframes purrbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0);}25%{transform:translate(-2px,0) rotate(-1deg);}75%{transform:translate(2px,0) rotate(1deg);}}

.cat-photo{
  width:100%;height:100%;
  object-fit:contain;
  pointer-events:none;
  filter:drop-shadow(0 8px 6px rgba(0,0,0,.25));
  transition:filter .2s ease;
}
.cat.annoyed .cat-photo{filter:drop-shadow(0 8px 6px rgba(0,0,0,.25)) saturate(1.4) contrast(1.08);}
.cat.angry .cat-photo{filter:drop-shadow(0 8px 6px rgba(226,121,90,.55)) saturate(1.6);}

.zone{position:absolute;left:0;right:0;}
.zone.head{top:0;height:45%;}
.zone.body{bottom:0;height:55%;}

.cup{
  position:absolute;
  bottom:calc(20% + 60px);
  width:34px;height:40px;
  background:var(--teal);
  border-radius:4px 4px 10px 10px;
  box-shadow:inset -4px 0 0 rgba(0,0,0,.12);
  cursor:grab;
  touch-action:none;
}
.cup:active{cursor:grabbing;}
.cup:after{content:"";position:absolute;top:6px;right:-9px;width:14px;height:16px;border:4px solid var(--teal);border-left:none;border-radius:0 8px 8px 0;}
.cup.gone{display:none;}

.shard{position:absolute;width:6px;height:6px;background:var(--teal);opacity:.9;pointer-events:none;}

.hud{
  position:absolute;top:10px;left:10px;right:10px;
  display:flex;gap:10px;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-size:12px;
}
.bar-wrap{background:rgba(74,55,40,.1);border-radius:20px;padding:4px 10px;flex:1;max-width:150px;}
.bar-label{display:flex;justify-content:space-between;margin-bottom:3px;}
.bar-track{height:6px;background:rgba(74,55,40,.15);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;transition:width .25s ease;}
.bar-fill.happy{background:var(--green-deep);}
.bar-fill.annoy{background:var(--coral-deep);}

.toast{
  position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);
  background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:20px;font-size:13px;
  font-family:'Baloo 2',sans-serif;
  opacity:0;transition:opacity .25s ease, transform .25s ease;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.controls{margin-top:16px;display:flex;gap:10px;}
button{
  font-family:'Baloo 2',sans-serif;
  font-size:14px;
  border:none;
  padding:9px 16px;
  border-radius:14px;
  background:var(--coral);
  color:#fff;
  cursor:pointer;
  box-shadow:0 4px 0 var(--coral-deep);
}
button:active{transform:translateY(3px);box-shadow:none;}
button.secondary{background:var(--teal);box-shadow:0 4px 0 #5d8f8a;}
</style>
</head>
<body>

<h1>Poocha 🐾</h1>
<p class="sub">Pet the belly to make friends. Pet the head too much and you'll regret it.</p>

<div class="stage" id="stage">
  <div class="wall"></div>
  <div class="floor"></div>

  <div class="table">
    <div class="tabletop-edge"></div>
    <div class="cup" id="cup" style="left:75%;"></div>
  </div>

  <div class="cat-wrap" id="catWrap
    <div class="cat"
